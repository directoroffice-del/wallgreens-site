<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="Wallgreens StiMBER timber beam with steel plate flanges">
  <defs>
    <!-- Galvanised steel plate gradient -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#eef0f2"/>
      <stop offset="45%" stop-color="#c4c7cc"/>
      <stop offset="55%" stop-color="#9ea1a6"/>
      <stop offset="100%" stop-color="#c4c7cc"/>
    </linearGradient>
    <!-- Solid timber body gradient -->
    <linearGradient id="timber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#c99770"/>
      <stop offset="50%" stop-color="#a06f47"/>
      <stop offset="100%" stop-color="#78502f"/>
    </linearGradient>
    <!-- End-grain gradient (darker) -->
    <linearGradient id="endGrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#8a5b35"/>
      <stop offset="100%" stop-color="#4e3018"/>
    </linearGradient>
    <!-- Wallgreens black branding strip -->
    <linearGradient id="brandStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="rgba(0,0,0,0.28)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <!-- Repeating oblong slot pattern for the steel plates -->
    <pattern id="slots" x="0" y="0" width="40" height="14" patternUnits="userSpaceOnUse">
      <rect width="40" height="14" fill="url(#steel)"/>
      <!-- oblong slot cutout (shows the darker steel/timber below) -->
      <rect x="10" y="4" width="20" height="6" rx="3" ry="3" fill="#5f6268"/>
      <!-- inner shadow on slot -->
      <rect x="10" y="4" width="20" height="6" rx="3" ry="3" fill="none" stroke="#3a3d40" stroke-width="0.8" opacity="0.8"/>
      <!-- highlight bottom edge -->
      <rect x="11" y="9" width="18" height="1" rx="0.5" fill="#8e9298" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="260" cy="138" rx="230" ry="7" fill="url(#shadow)"/>

  <!-- SOLID TIMBER BODY (middle rectangle) -->
  <rect x="20" y="42" width="480" height="56" fill="url(#timber)"/>
  <!-- wood grain lines -->
  <g stroke="#6b4427" stroke-width="0.9" opacity="0.45" fill="none">
    <path d="M30 52 Q 260 49, 490 53"/>
    <path d="M28 62 Q 260 59, 492 63"/>
    <path d="M30 72 Q 260 69, 490 73"/>
    <path d="M28 82 Q 260 79, 492 83"/>
    <path d="M30 92 Q 260 89, 490 93"/>
  </g>

  <!-- BLACK WALLGREENS BRANDING STRIP across center -->
  <rect x="20" y="64" width="480" height="14" fill="url(#brandStrip)"/>
  <!-- brand text -->
  <text x="260" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="700" fill="#d9a900" letter-spacing="1.4">
    WALLGREENS  J70 StiMBER™
  </text>

  <!-- TOP STEEL PLATE with oblong slots -->
  <rect x="20" y="32" width="480" height="14" fill="url(#slots)"/>
  <!-- top highlight -->
  <rect x="20" y="32" width="480" height="2" fill="#f4f6f8"/>
  <!-- bottom shadow line (where steel meets timber) -->
  <rect x="20" y="45" width="480" height="1.5" fill="#3a3d40" opacity="0.55"/>

  <!-- BOTTOM STEEL PLATE with oblong slots -->
  <rect x="20" y="94" width="480" height="14" fill="url(#slots)"/>
  <rect x="20" y="94" width="480" height="2" fill="#f4f6f8"/>
  <rect x="20" y="107" width="480" height="1.5" fill="#3a3d40" opacity="0.55"/>

  <!-- LEFT END (cross-section reveal — shows timber end-grain + steel caps) -->
  <rect x="14" y="32" width="6" height="76" fill="url(#endGrain)"/>
  <rect x="14" y="32" width="6" height="14" fill="#7d8085"/>
  <rect x="14" y="94" width="6" height="14" fill="#7d8085"/>

  <!-- RIGHT END -->
  <rect x="500" y="32" width="6" height="76" fill="url(#endGrain)"/>
  <rect x="500" y="32" width="6" height="14" fill="#7d8085"/>
  <rect x="500" y="94" width="6" height="14" fill="#7d8085"/>

  <!-- Yellow grade sticker (small) near left end -->
  <rect x="50" y="82" width="32" height="8" rx="1.5" fill="#f2c200" stroke="#8b6f00" stroke-width="0.5"/>
  <text x="66" y="88.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="5.5" font-weight="700" fill="#2a2000">J70 · 6.0m</text>
</svg>
